<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#100b08">
  <meta name="description" content="공격 의도와 패링·구르기 교리를 검증하는 트로이 V16 병행 전장">
  <title>트로이: 최후의 팔랑크스 V16</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,"Noto Sans KR",sans-serif;background:#100b08;color:#f3e5bd}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at 50% 40%,#49301c,#100b08 72%)}#battlefield{width:100vw;height:100vh;display:block}.panel{position:fixed;background:linear-gradient(150deg,rgba(24,17,12,.94),rgba(53,35,21,.88));border:1px solid #a8753b;border-radius:12px;box-shadow:0 12px 42px #000a;backdrop-filter:blur(8px)}#roster{left:24px;top:24px;padding:14px;width:310px}h1{font-family:Georgia,serif;font-size:21px;margin:0 0 4px;color:#ffd98c}.version{font-size:11px;letter-spacing:.18em;color:#d59754}.heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}button{border:1px solid #9f713d;background:#2b1d13;color:#f8e7bc;border-radius:8px;padding:9px;cursor:pointer}button[aria-pressed="true"]{background:#8e3e2a;border-color:#ffc267}.doctrine{font-size:12px;color:#d7c49e;margin:10px 0 0;line-height:1.45}#combatHud{right:24px;top:24px;padding:14px;min-width:280px}.action{display:grid;grid-template-columns:65px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #7d59374d}.key{font-weight:800;color:#ffc267}.phase{justify-self:end;color:#ddd}.tutorial{left:50%;bottom:24px;transform:translateX(-50%);padding:13px 18px;text-align:center;min-width:420px}.tutorial b{color:#ffcf72}.tagLegend{position:fixed;right:24px;bottom:24px;font-size:12px;padding:10px 14px}.tagLegend span{display:block;margin:5px}.wedge:before{content:'▲';color:#f0c15f}.chevron:before{content:'≫';color:#e26b59}.ring:before{content:'◌';color:#e6e1d5}@media(max-width:760px){#roster{width:calc(100vw - 48px)}#combatHud{top:auto;bottom:96px}.tutorial{min-width:0;width:calc(100vw - 48px)}}
  </style>
</head>
<body>
  <canvas id="battlefield" aria-label="V16 트로이 전투 검증 전장"></canvas>
  <section id="roster" class="panel"><div class="version">V16 PARALLEL COMBAT ROUTE</div><h1>한 명의 영웅, 하나의 전열</h1><div class="heroes"><button data-hero="hoplite" aria-pressed="true">방패<br>테라몬</button><button data-hero="swordsman" aria-pressed="false">검<br>아킬레온</button><button data-hero="archer" aria-pressed="false">활<br>칼카스</button></div><p class="doctrine" id="doctrineText">넓은 150° 패링과 전방 광역 경직. 안정적인 방패 교리.</p></section>
  <section id="combatHud" class="panel"><div class="action"><span class="key">SPACE</span><span>패링</span><b class="phase" id="parryPhase">준비</b></div><div class="action"><span class="key">SHIFT</span><span>전술 구르기</span><b class="phase" id="dodgePhase">준비</b></div><div class="action"><span class="key">WASD</span><span>이동</span><b class="phase" id="distanceText">0 px</b></div><small>게임패드: LB 패링 · B 구르기 · 왼쪽 스틱 이동</small></section>
  <section class="tutorial panel"><b id="tutorialStep">이동 훈련</b><span id="tutorialText">WASD 또는 왼쪽 스틱으로 120px 이동하십시오.</span></section>
  <aside class="tagLegend panel"><span class="wedge"> 정면 패링</span><span class="chevron"> 구르기 전용</span><span class="ring"> 방어 불가</span></aside>
  <script type="module" src="js/game-v16.js?v=16.0.0"></script>
</body>
</html>
